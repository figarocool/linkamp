name: Build Deb package

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

env:
  EXTRA_BUILD_DEPS: dh-python dh-cmake
  QT_VERSION: 6.8.3

jobs:
  build-x86_64-bookworm:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Set package version for bookworm
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || release_version=1.6.3
          echo "LINKAMP_BUILD_VERSION=$release_version" >> "$GITHUB_ENV"
          sed -i -E "1 s/\([^)]+\) [^;]+;/\\(${release_version}~bookworm1\\) bookworm;/" debian/changelog
      - name: Build Debian packages
        uses: jtdor/build-deb-action@v1.8.0
        with:
          # Name of a Docker image or path of a Dockerfile to use for the build container
          docker-image: debian:bookworm-slim
          # Extra packages to be installed as build dependencies
          extra-build-deps: ${{ env.EXTRA_BUILD_DEPS }}
      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linamp-x86_64-bookworm
          path: debian/artifacts/*

  build-x86_64-trixie:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Set package version for trixie
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || release_version=1.6.3
          echo "LINKAMP_BUILD_VERSION=$release_version" >> "$GITHUB_ENV"
          sed -i -E "1 s/\([^)]+\) [^;]+;/\\(${release_version}~trixie1\\) trixie;/" debian/changelog
      - name: Build Debian packages
        uses: jtdor/build-deb-action@v1.8.0
        with:
          # Name of a Docker image or path of a Dockerfile to use for the build container
          docker-image: debian:trixie-slim
          # Extra packages to be installed as build dependencies
          extra-build-deps: ${{ env.EXTRA_BUILD_DEPS }}
      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linamp-x86_64-trixie
          path: debian/artifacts/*

  build-arm64-bookworm:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
      - name: Set package version for bookworm
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || release_version=1.6.3
          echo "LINKAMP_BUILD_VERSION=$release_version" >> "$GITHUB_ENV"
          sed -i -E "1 s/\([^)]+\) [^;]+;/\\(${release_version}~bookworm1\\) bookworm;/" debian/changelog
      - name: Build Debian packages
        uses: jtdor/build-deb-action@v1.8.0
        with:
          # Name of a Docker image or path of a Dockerfile to use for the build container
          docker-image: debian:bookworm-slim
          # Extra packages to be installed as build dependencies
          extra-build-deps: ${{ env.EXTRA_BUILD_DEPS }}
      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linamp-arm64-bookworm
          path: debian/artifacts/*

  build-arm64-trixie:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
      - name: Set package version for trixie
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || release_version=1.6.3
          echo "LINKAMP_BUILD_VERSION=$release_version" >> "$GITHUB_ENV"
          sed -i -E "1 s/\([^)]+\) [^;]+;/\\(${release_version}~trixie1\\) trixie;/" debian/changelog
      - name: Build Debian packages
        uses: jtdor/build-deb-action@v1.8.0
        with:
          # Name of a Docker image or path of a Dockerfile to use for the build container
          docker-image: debian:trixie-slim
          # Extra packages to be installed as build dependencies
          extra-build-deps: ${{ env.EXTRA_BUILD_DEPS }}
      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linamp-arm64-trixie
          path: debian/artifacts/*

  build-browser-extensions:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Package Chrome and Firefox extensions
        run: |
          mkdir -p release
          (cd chrome-extension && zip -r ../release/linkamp-chrome-extension.zip .)
          (cd firefox-extension && zip -r ../release/linkamp-firefox-extension.xpi .)
      - uses: actions/upload-artifact@v7
        with:
          name: linkamp-browser-extensions
          path: release/*

  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Install native dependencies
        shell: bash
        run: '"$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libarchive taglib --triplet x64-windows --disable-metrics'
      - name: Build and deploy Linkamp
        shell: bash
        run: |
          LINKAMP_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$LINKAMP_BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || LINKAMP_BUILD_VERSION=1.6.3
          export LINKAMP_BUILD_VERSION
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DLINKAMP_ENABLE_LINUX_INTEGRATIONS=OFF
          cmake --build build --config Release --parallel 2
          cmake --install build --config Release --prefix "$RUNNER_TEMP/linkamp-stage"
          cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/"*.dll \
            "$RUNNER_TEMP/linkamp-stage/bin/"
      - name: Install Qt Installer Framework
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/aqt-env"
          "$RUNNER_TEMP/aqt-env/Scripts/python.exe" -m pip install -q aqtinstall
          "$RUNNER_TEMP/aqt-env/Scripts/aqt.exe" install-tool windows desktop tools_ifw qt.tools.ifw.47 -O "$RUNNER_TEMP/Qt"
      - name: Create Windows installer and update component
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || version=1.6.3
          release_date="$(date -u +%Y-%m-%d)"
          package_id=org.linkamp.player.windows
          mkdir -p "ifw/packages/$package_id/meta" "ifw/packages/$package_id/data"
          cp -R "$RUNNER_TEMP/linkamp-stage/." "ifw/packages/$package_id/data/"
          sed -e "s/@LINKAMP_VERSION@/$version/g" \
              -e "s/@LINKAMP_RELEASE_DATE@/$release_date/g" \
              "packaging/ifw/package.xml.in" > "ifw/packages/$package_id/meta/package.xml"
          cp packaging/ifw/installscript.qs "ifw/packages/$package_id/meta/"
          sed -e "s/@LINKAMP_VERSION@/$version/g" \
              -e 's|@LINKAMP_TARGET_DIR@|@HomeDir@/Linkamp|g' \
              -e 's|@LINKAMP_PLATFORM@|windows|g' \
              packaging/ifw/config.xml.in > ifw/config.xml
          ifw_bin="$RUNNER_TEMP/Qt/Tools/QtInstallerFramework/4.7/bin"
          "$ifw_bin/binarycreator.exe" -c ifw/config.xml -p ifw/packages \
            -t "$ifw_bin/installerbase.exe" "$RUNNER_TEMP/Linkamp-Setup-windows-x64.exe"
          mkdir -p "$RUNNER_TEMP/update-packages"
          cp -R "ifw/packages/$package_id" "$RUNNER_TEMP/update-packages/"
      - uses: actions/upload-artifact@v7
        with:
          name: linkamp-windows-installer
          path: ${{ runner.temp }}/Linkamp-Setup-windows-x64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: linkamp-windows-update-package
          path: ${{ runner.temp }}/update-packages/org.linkamp.player.windows

  build-macos-arm64:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: brew install qt taglib libarchive
      - name: Build and deploy Linkamp
        run: |
          LINKAMP_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$LINKAMP_BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || LINKAMP_BUILD_VERSION=1.6.3
          export LINKAMP_BUILD_VERSION
          qt_prefix="$(brew --prefix qt)"
          taglib_prefix="$(brew --prefix taglib)"
          archive_prefix="$(brew --prefix libarchive)"
          export PATH="$qt_prefix/bin:$PATH"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DLINKAMP_ENABLE_LINUX_INTEGRATIONS=OFF \
            -DCMAKE_PREFIX_PATH="$qt_prefix;$taglib_prefix;$archive_prefix" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build build --config Release --parallel 2
          cmake --install build --config Release --prefix "$RUNNER_TEMP/linkamp-stage"
      - name: Install Qt Installer Framework
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-env"
          "$RUNNER_TEMP/aqt-env/bin/python" -m pip install -q aqtinstall
          "$RUNNER_TEMP/aqt-env/bin/aqt" install-tool mac desktop tools_ifw qt.tools.ifw.47 -O "$RUNNER_TEMP/Qt"
      - name: Create macOS installer and update component
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || version=1.6.3
          release_date="$(date -u +%Y-%m-%d)"
          package_id=org.linkamp.player.macos.arm64
          mkdir -p "ifw/packages/$package_id/meta" "ifw/packages/$package_id/data"
          cp -R "$RUNNER_TEMP/linkamp-stage/." "ifw/packages/$package_id/data/"
          sed -e "s/@LINKAMP_VERSION@/$version/g" \
              -e "s/@LINKAMP_RELEASE_DATE@/$release_date/g" \
              "packaging/ifw/package.xml.in" > "ifw/packages/$package_id/meta/package.xml"
          cp packaging/ifw/installscript.qs "ifw/packages/$package_id/meta/"
          sed -e "s/@LINKAMP_VERSION@/$version/g" \
              -e 's|@LINKAMP_TARGET_DIR@|@HomeDir@/Applications/Linkamp|g' \
              -e 's|@LINKAMP_PLATFORM@|macos-arm64|g' \
              packaging/ifw/config.xml.in > ifw/config.xml
          ifw_bin="$RUNNER_TEMP/Qt/Tools/QtInstallerFramework/4.7/bin"
          "$ifw_bin/binarycreator" -c ifw/config.xml -p ifw/packages \
            -t "$ifw_bin/installerbase" "$RUNNER_TEMP/Linkamp-macos-installer.app"
          hdiutil create -volname Linkamp -srcfolder "$RUNNER_TEMP/Linkamp-macos-installer.app" \
            -ov -format UDZO "$RUNNER_TEMP/Linkamp-Installer-macos-arm64.dmg"
          mkdir -p "$RUNNER_TEMP/update-packages"
          cp -R "ifw/packages/$package_id" "$RUNNER_TEMP/update-packages/"
          tar -czf "$RUNNER_TEMP/linkamp-macos-arm64-update-package.tar.gz" \
            -C "$RUNNER_TEMP/update-packages" "$package_id"
      - uses: actions/upload-artifact@v7
        with:
          name: linkamp-macos-arm64-installer
          path: ${{ runner.temp }}/Linkamp-Installer-macos-arm64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: linkamp-macos-arm64-update-package
          path: ${{ runner.temp }}/linkamp-macos-arm64-update-package.tar.gz


  build-macos-x64:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true
      - name: Install native dependencies
        run: brew install taglib libarchive
      - name: Build and deploy Linkamp
        run: |
          LINKAMP_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$LINKAMP_BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || LINKAMP_BUILD_VERSION=1.6.3
          export LINKAMP_BUILD_VERSION
          taglib_prefix="$(brew --prefix taglib)"
          archive_prefix="$(brew --prefix libarchive)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DLINKAMP_ENABLE_LINUX_INTEGRATIONS=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$taglib_prefix;$archive_prefix" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build build --config Release --parallel 2
          cmake --install build --config Release --prefix "$RUNNER_TEMP/linkamp-stage"
      - name: Install Qt Installer Framework
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-env"
          "$RUNNER_TEMP/aqt-env/bin/python" -m pip install -q aqtinstall
          "$RUNNER_TEMP/aqt-env/bin/aqt" install-tool mac desktop tools_ifw qt.tools.ifw.47 -O "$RUNNER_TEMP/Qt"
      - name: Create macOS installer and update component
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || version=1.6.3
          release_date="$(date -u +%Y-%m-%d)"
          package_id=org.linkamp.player.macos.x64
          mkdir -p "ifw/packages/$package_id/meta" "ifw/packages/$package_id/data"
          cp -R "$RUNNER_TEMP/linkamp-stage/." "ifw/packages/$package_id/data/"
          sed -e "s/@LINKAMP_VERSION@/$version/g" \
              -e "s/@LINKAMP_RELEASE_DATE@/$release_date/g" \
              "packaging/ifw/package.xml.in" > "ifw/packages/$package_id/meta/package.xml"
          cp packaging/ifw/installscript.qs "ifw/packages/$package_id/meta/"
          sed -e "s/@LINKAMP_VERSION@/$version/g" \
              -e 's|@LINKAMP_TARGET_DIR@|@HomeDir@/Applications/Linkamp|g' \
              -e 's|@LINKAMP_PLATFORM@|macos-x64|g' \
              packaging/ifw/config.xml.in > ifw/config.xml
          ifw_bin="$RUNNER_TEMP/Qt/Tools/QtInstallerFramework/4.7/bin"
          "$ifw_bin/binarycreator" -c ifw/config.xml -p ifw/packages \
            -t "$ifw_bin/installerbase" "$RUNNER_TEMP/Linkamp-macos-installer.app"
          hdiutil create -volname Linkamp -srcfolder "$RUNNER_TEMP/Linkamp-macos-installer.app" \
            -ov -format UDZO "$RUNNER_TEMP/Linkamp-Installer-macos-x64.dmg"
          mkdir -p "$RUNNER_TEMP/update-packages"
          cp -R "ifw/packages/$package_id" "$RUNNER_TEMP/update-packages/"
          tar -czf "$RUNNER_TEMP/linkamp-macos-x64-update-package.tar.gz" \
            -C "$RUNNER_TEMP/update-packages" "$package_id"
      - uses: actions/upload-artifact@v7
        with:
          name: linkamp-macos-x64-installer
          path: ${{ runner.temp }}/Linkamp-Installer-macos-x64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: linkamp-macos-x64-update-package
          path: ${{ runner.temp }}/linkamp-macos-x64-update-package.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-x86_64-bookworm
      - build-x86_64-trixie
      - build-arm64-bookworm
      - build-arm64-trixie
      - build-browser-extensions
      - build-windows
      - build-macos-arm64
      - build-macos-x64
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Verify and prepare release files
        run: |
          set -eu
          expected_artifacts=11
          actual_artifacts=$(find release-artifacts -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$actual_artifacts" -ne "$expected_artifacts" ]; then
            echo "Expected $expected_artifacts artifact directories, got $actual_artifacts"
            exit 1
          fi

          mkdir -p release
          for dir in release-artifacts/linamp-*; do
            for deb in "$dir"/*.deb; do
              [ -e "$deb" ] || continue
              deb_name=$(basename "$deb" .deb)
              cp "$deb" "release/${deb_name}.deb"
            done
          done

          for deb in release/linkamp_*.deb; do
            [ -e "$deb" ] || continue
            asset_name=${deb##*/}
            if [[ "$asset_name" =~ ^(linkamp_[0-9]+\.[0-9]+\.[0-9]+)\.(bookworm|trixie)([0-9]+)_(amd64|arm64)\.deb$ ]]; then
              alias_name="${BASH_REMATCH[1]}~${BASH_REMATCH[2]}${BASH_REMATCH[3]}_${BASH_REMATCH[4]}.deb"
              cp "$deb" "release/$alias_name"
            fi
          done

          cp release-artifacts/linkamp-browser-extensions/* release/
          cp release-artifacts/linkamp-windows-installer/* release/
          cp release-artifacts/linkamp-macos-arm64-installer/* release/
          cp release-artifacts/linkamp-macos-x64-installer/* release/

          deb_count=$(find release -maxdepth 1 -type f -name '*.deb' | wc -l)
          if [ "$deb_count" -eq 0 ]; then
            echo "No .deb files were prepared for release"
            exit 1
          fi

          ls -la release

      - name: Install Qt Installer Framework for update repositories
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-env"
          "$RUNNER_TEMP/aqt-env/bin/pip" install -q aqtinstall
          "$RUNNER_TEMP/aqt-env/bin/aqt" install-tool linux desktop tools_ifw qt.tools.ifw.47 -O "$RUNNER_TEMP/Qt"
      - name: Build cross-platform update repositories
        run: |
          set -eu
          update_packages="$RUNNER_TEMP/update-packages"
          update_site="$RUNNER_TEMP/update-site"
          mkdir -p "$update_packages/org.linkamp.player.windows" \
                   "$update_packages/org.linkamp.player.macos.arm64" \
                   "$update_packages/org.linkamp.player.macos.x64" \
                   "$update_site/updates"
          cp -R release-artifacts/linkamp-windows-update-package/. \
            "$update_packages/org.linkamp.player.windows/"
          tar -xzf release-artifacts/linkamp-macos-arm64-update-package/linkamp-macos-arm64-update-package.tar.gz \
            -C "$update_packages"
          tar -xzf release-artifacts/linkamp-macos-x64-update-package/linkamp-macos-x64-update-package.tar.gz \
            -C "$update_packages"
          ifw_bin="$RUNNER_TEMP/Qt/Tools/QtInstallerFramework/4.7/bin"
          "$ifw_bin/repogen" -p "$update_packages" -i org.linkamp.player.windows \
            "$update_site/updates/windows"
          "$ifw_bin/repogen" -p "$update_packages" -i org.linkamp.player.macos.arm64 \
            "$update_site/updates/macos-arm64"
          "$ifw_bin/repogen" -p "$update_packages" -i org.linkamp.player.macos.x64 \
            "$update_site/updates/macos-x64"
          cp -R "$update_site/." update-site/
      - uses: actions/upload-artifact@v7
        with:
          name: linkamp-update-repositories
          path: update-site/
      - uses: actions/upload-artifact@v7
        with:
          name: linkamp-release-assets
          path: release/

  deploy-update-repositories:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: linkamp-update-repositories
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: deploy-update-repositories
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linkamp-release-assets
          path: release
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.deb
            release/*.zip
            release/*.xpi
            release/*.exe
            release/*.dmg
